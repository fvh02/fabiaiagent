configuration:
  mode:
    name: Modus
    description: paper = Papertrading mit echten Kursen und simuliertem Geld. live = echtes Geld (nur zusammen mit API-Key und Bestätigung unten).
  budget_eur:
    name: Budget (EUR)
    description: Mit so viel Geld handelt Claude – nie mehr. Gilt beim Start eines neuen Kontos (auch beim Wechsel paper → live).
  coins:
    name: Coins
    description: auto = die meistgehandelten Coins der Börse (auch kleine). Oder eine feste Liste mit Komma, z. B. BTC,ETH,SOL.
  news_sources:
    name: Nachrichtenquellen
    description: RSS-Feeds oder Webseiten (mit Feed), auf deren Nachrichten sich Claude bezieht. Claude liest nur diese Quellen, keine allgemeine Websuche. Liste leer = Claude darf frei im Web suchen.
  profit_step_pct:
    name: Gewinnstufe (%)
    description: Verkauft Claude mit Gewinn, wird nur in vollen Stufen verkauft (+12 % → Einkaufspreis plus 10 % verkauft, 2 % bleiben als Coin). Diese Rest-Coins werden getaggt, nie verkauft und zählen beim endgültigen Stopp zum Gewinn. 0 = aus.
  auto_top:
    name: Anzahl Coins (auto)
    description: Bei „auto“ werden so viele der meistgehandelten Coins betrachtet.
  min_volume_eur:
    name: Mindest-Umsatz (EUR/24 h)
    description: Bei „auto“ nur Coins mit so viel Handelsvolumen – schützt vor kaum gehandelten Coins.
  decision_every_hours:
    name: Entscheidung alle … Stunden
    description: So oft entscheidet Claude (jede Entscheidung verbraucht etwas Claude-Kontingent).
  check_minutes:
    name: Sicherheitsprüfung alle … Minuten
    description: So oft werden Stop-Loss und Verlustgrenze geprüft (ohne Claude).
  report_hour:
    name: Tagesbericht um
    description: Ab dieser Stunde kommt einmal am Tag ein Bericht per iMessage. Trades werden sofort gemeldet.
  max_small_pct:
    name: Max. pro kleinem Coin (%)
    description: Kleine Coins (alles außer den großen wie BTC, ETH, SOL, XRP …) höchstens so viel Prozent des Gesamtwerts.
  max_orders_day:
    name: Max. Orders pro Tag
    description: Schützt vor zu häufigem Hin und Her (Notverkäufe zählen nicht).
  max_trade_pct:
    name: Max. pro Kauf (%)
    description: Ein Kauf höchstens so viel Prozent des Gesamtwerts.
  max_position_pct:
    name: Max. pro Coin (%)
    description: Ein Coin höchstens so viel Prozent des Gesamtwerts.
  min_cash_pct:
    name: Bargeld-Reserve (%)
    description: So viel Prozent bleiben immer als Euro übrig.
  stop_loss_pct:
    name: Stop-Loss (%)
    description: Ein Coin wird automatisch verkauft, wenn er so viel unter dem Einkaufspreis liegt (stündlich geprüft).
  max_drawdown_pct:
    name: Verlustgrenze gesamt (%)
    description: Liegt der Gesamtwert so viel unter dem Start, wird alles verkauft und das Trading gestoppt.
  fee_pct:
    name: Gebühr Papertrading (%)
    description: Simulierte Gebühr pro Trade, damit das Papertrading realistisch bleibt.
  exchange:
    name: Börse
    description: Kurse kommen von dieser Börse; im Live-Modus wird dort gehandelt.
  api_key:
    name: API-Key (nur live)
    description: API-Key der Börse – NUR mit Handelsrecht, OHNE Auszahlungsrecht. Am besten für ein eigenes Unterkonto/Portfolio.
  api_secret:
    name: API-Secret (nur live)
    description: Das zugehörige Secret.
  api_password:
    name: API-Passphrase
    description: Nur falls die Börse eine Passphrase verlangt.
  live_confirm:
    name: Echtgeld-Bestätigung
    description: Für echtes Trading hier genau ICH TRAGE DAS RISIKO eintragen. Sonst bleibt es beim Papertrading.
  claude_oauth_token:
    name: Claude-Token (optional)
    description: Leer lassen – dann fragt der Trader Claude über dein Inkbox Claude Gateway (ab 0.12.0) mit dessen Anmeldung. Nur nötig, wenn du einen eigenen Token aus „claude setup-token“ nutzen willst.
  claude_bridge_url:
    name: Gateway-Adresse
    description: Interne Adresse der Claude-Brücke im Gateway. Die Vorgabe passt, wenn beide aus diesem Repository installiert sind.
  claude_model:
    name: Claude-Modell
    description: Optional, leer = Standard.
  inkbox_api_key:
    name: Inkbox API-Key
    description: Für den täglichen Bericht und Warnungen per iMessage.
  imessage_to:
    name: Deine Handynummer
    description: Im Format +491701234567.
