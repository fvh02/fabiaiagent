configuration:
  inkbox_api_key:
    name: Inkbox-API-Key
    description: API-Key aus deinem Inkbox-Konto (inkbox.ai).
  inkbox_identity:
    name: Inkbox-Identität
    description: Handle deiner Inkbox-Identität, ohne @.
  claude_oauth_token:
    name: Claude-OAuth-Token
    description: Für ein Claude-Abo. Erzeugen mit „claude setup-token“ auf einem Rechner mit Claude Code. Alternativ den Anthropic-API-Key ausfüllen.
  anthropic_api_key:
    name: Anthropic-API-Key
    description: Alternative zum OAuth-Token, Abrechnung pro Token (console.anthropic.com).
  claude_ai_login:
    name: claude.ai-Anmeldung verwenden
    description: Nutzt eine importierte claude.ai-Anmeldung (für deine claude.ai-Connectoren), siehe Doku. Ausschalten löscht sie, dann gilt wieder das OAuth-Token.
  reply_language:
    name: Antwortsprache
    description: Sprache, in der Claude antwortet. Schreibst du in einer anderen Sprache oder schickst eine Datei in einer anderen Sprache, antwortet Claude in dieser. „Automatisch“ = keine Vorgabe.
  icloud_apple_id:
    name: Apple-ID (Kalender)
    description: E-Mail-Adresse deiner Apple-ID. Leer lassen, wenn Claude keinen Kalenderzugriff haben soll.
  icloud_app_password:
    name: App-spezifisches Passwort (Kalender)
    description: Nicht dein Apple-Passwort! Unter account.apple.com → Anmeldung und Sicherheit → App-spezifische Passwörter erzeugen.
  icloud_ai_calendar:
    name: Kalender für KI-Termine
    description: Alle Termine, die Claude anlegt, landen in diesem Kalender. Muss in der Kalender-App existieren. Leer = Claude wählt den Kalender.
  voice_transcription:
    name: Sprachnachrichten
    description: Whisper-Modell zum Transkribieren von Sprachnachrichten. tiny/base = schnell, small = guter Kompromiss, medium/turbo = genauer, aber langsamer und mehr RAM. „aus“ = keine Transkription.
  project_dir:
    name: Arbeitsordner
    description: Ordner, in dem Claude arbeitet. Unter /share auch per Samba erreichbar.
  voice_ai:
    name: Voice AI
    description: Sprachanrufe einrichten. Nur sinnvoll, wenn die Identität eine Telefonnummer hat.
  claude_model:
    name: Claude-Modell
    description: Optional. Leer lassen für das Standardmodell.
  downloader_url:
    name: Downloader-Adresse
    description: Interne Adresse des Downloader-Add-ons mit Port 8100. Den Hostnamen zeigt der Downloader im Reiter „Info“.
  downloader_token:
    name: Downloader-API-Token
    description: Der api_token aus der Konfiguration des Downloader-Add-ons. Leer lassen, wenn Claude keine Downloads steuern soll.
