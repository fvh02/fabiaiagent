configuration:
  inkbox_api_key:
    name: Inkbox API key
    description: API key from your Inkbox account (inkbox.ai).
  inkbox_identity:
    name: Inkbox identity
    description: Handle of your Inkbox identity, without @.
  claude_oauth_token:
    name: Claude OAuth token
    description: For a Claude subscription. Create it with "claude setup-token" on a machine with Claude Code. Or fill in the Anthropic API key instead.
  anthropic_api_key:
    name: Anthropic API key
    description: Alternative to the OAuth token, billed per token (console.anthropic.com).
  claude_ai_login:
    name: Use claude.ai login
    description: Uses an imported claude.ai login (for your claude.ai connectors), see docs. Turning it off deletes it and the OAuth token is used again.
  reply_language:
    name: Reply language
    description: Language Claude replies in. If you write in another language or send a file in another language, Claude replies in that one. "Automatisch" = no preference.
  icloud_apple_id:
    name: Apple ID (calendar)
    description: Email address of your Apple ID. Leave empty if Claude should not access your calendar.
  icloud_app_password:
    name: App-specific password (calendar)
    description: Not your Apple password! Create one at account.apple.com → Sign-In and Security → App-Specific Passwords.
  icloud_ai_calendar:
    name: Calendar for AI events
    description: Every event Claude creates goes into this calendar. It must exist in the Calendar app. Empty = Claude picks the calendar.
  voice_transcription:
    name: Voice messages
    description: Whisper model used to transcribe voice messages. tiny/base = fast, small = good balance, medium/turbo = more accurate but slower and more RAM. "aus" = off.
  project_dir:
    name: Working directory
    description: Directory Claude works in. Under /share it is also reachable via Samba.
  voice_ai:
    name: Voice AI
    description: Set up voice calls. Only useful if the identity has a phone number.
  claude_model:
    name: Claude model
    description: Optional. Leave empty for the default model.
  downloader_url:
    name: Downloader address
    description: Internal address of the Downloader add-on with port 8099. The Downloader shows its hostname on its Info tab. Leave empty if Claude should not control downloads.
  addon_management:
    name: Manage add-ons
    description: Claude may list add-ons and repositories and – after you confirm by message – add/remove repositories and install, update and uninstall add-ons.
  ebay_client_id:
    name: eBay Client ID
    description: App ID from your eBay developer account (production keyset). Leave empty if Claude should not search eBay.
  ebay_client_secret:
    name: eBay Client Secret
    description: Cert ID from the same production keyset.
  ebay_zip:
    name: Your postal code
    description: For exact shipping costs in search results (optional).
  ebay_notify_to:
    name: Price alerts to
    description: Your phone number as +49…, which receives new matches of your price alerts by iMessage. Empty = no price alerts.
  druck_url:
    name: 3D printing address
    description: Internal address of the 3D printing add-on. The default fits when it is installed from this repository. Leave empty if Claude should not print.
  krypto_url:
    name: Crypto trader address
    description: Internal address of the crypto trader add-on. The default fits when installed from this repository. Empty = not connected.
