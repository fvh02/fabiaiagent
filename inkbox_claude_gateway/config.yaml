name: Inkbox Claude Gateway
version: "0.12.1"
slug: inkbox_claude_gateway
description: Weckt Claude Code bei eingehenden E-Mails und iMessages über Inkbox.
url: https://github.com/fvh02/fabiaiagent
image: ghcr.io/fvh02/{arch}-inkbox-claude-gateway
arch:
  - amd64
  - aarch64
startup: application
boot: auto
hassio_api: true
hassio_role: manager
map:
  - share:rw
backup_exclude:
  - whisper-models
  - whisper-models/**
options:
  inkbox_api_key: ""
  inkbox_identity: ""
  claude_oauth_token: ""
  anthropic_api_key: ""
  claude_ai_login: true
  reply_language: Deutsch
  icloud_apple_id: ""
  icloud_app_password: ""
  icloud_ai_calendar: Added by AI Agent
  voice_transcription: small
  project_dir: /share/claude-workspace
  voice_ai: false
  claude_model: ""
  downloader_url: http://4b225c51-downloader:8099
  addon_management: true
  ebay_client_id: ""
  ebay_client_secret: ""
  ebay_zip: ""
  ebay_notify_to: ""
  druck_url: http://afcf546d-druck3d:8095
  krypto_url: http://afcf546d-krypto:8094
schema:
  inkbox_api_key: password
  inkbox_identity: str
  claude_oauth_token: password?
  anthropic_api_key: password?
  claude_ai_login: bool
  reply_language: list(Automatisch|Deutsch|English|Español|Français|Italiano|Nederlands|Polski|Português|Türkçe)
  icloud_apple_id: str?
  icloud_app_password: password?
  icloud_ai_calendar: str?
  voice_transcription: list(aus|tiny|base|small|medium|turbo)
  project_dir: str
  voice_ai: bool
  claude_model: str?
  downloader_url: str?
  addon_management: bool
  ebay_client_id: str?
  ebay_client_secret: password?
  ebay_zip: str?
  ebay_notify_to: str?
  druck_url: str?
  krypto_url: str?
